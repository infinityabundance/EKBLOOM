[package]
name = "ekbloom"
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
description = "EKBLOOM — concealed-expansion codec. Spend manifested space to maximise speed."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/infinityabundance/EKBLOOM"
homepage = "https://github.com/infinityabundance/EKBLOOM"
documentation = "https://docs.rs/ekbloom"
keywords = ["codec", "compression", "ans", "storage", "systems"]
categories = ["compression", "data-structures"]
exclude = ["/fuzz", "/evidence", "/.cargo-home", "/research", "/target"]

[lib]
name = "ekbloom"
path = "src/lib.rs"

[[bin]]
name = "ekbloom"
path = "src/main.rs"

[dependencies]
blake3 = "1.5"
crc32fast = "1.4"

# Raw read-only mmap/madvise/munmap for `src/mapped.rs` (the third sanctioned
# `unsafe` boundary). Small, standard, already present transitively; exposes the
# exact `MAP_POPULATE`/`MADV_POPULATE_READ`/`MADV_HUGEPAGE` flags the directive
# requires (unlike the deliberately-dropped `memmap2`).
libc = "0.2"

# Async I/O publication backend. Optional; a synchronous fallback is always built.
io-uring = { version = "0.7", optional = true }

# Read-only FUSE projection of the in-process OrFs namespace. Optional; off by
# default. Built without the `libfuse` feature so no libfuse/pkg-config is needed.
fuser = { version = "0.15", default-features = false, features = ["abi-7-31"], optional = true }

[features]
default = []
io-uring = ["dep:io-uring"]
fuse = ["dep:fuser"]

[dev-dependencies]
proptest = "1.5"
divan = "0.1"

# Competitor codecs, used ONLY for measurement (examples/tests/benches). They are
# never part of the shipped `ekbloom` codec: the library itself depends on them
# nowhere. `lz4_flex` is pure Rust; `zstd` links the bundled C library via `cc`.
lz4_flex = "0.11"
zstd = "0.13"

# Loom model-checking, enabled only by `RUSTFLAGS="--cfg loom"`. This is a
# *target-gated normal dependency*, not a dev-dependency: `src/filesystem.rs`
# itself selects `loom::sync::Mutex` under `#[cfg(loom)]` so the real `OrFs`
# index is model-checked, and a library cannot see dev-dependencies. Normal
# builds never activate `cfg(loom)` and so never compile or link loom.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

# Declare `loom` as a known cfg name so the `unexpected_cfgs` lint does not fire
# under `-D warnings` for either the loom build or ordinary builds.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

# Divan benchmarks own their entry point, so the libtest harness is disabled.
[[bench]]
name = "ekbloom"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
