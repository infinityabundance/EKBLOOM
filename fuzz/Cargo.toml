[package]
name = "ekbloom-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ekbloom = { path = ".." }

# Standalone workspace so the parent (non-workspace) crate's toolchain/build do
# not absorb the fuzz targets.
[workspace]

[[bin]]
name = "fuzz_machine"
path = "fuzz_targets/fuzz_machine.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_open"
path = "fuzz_targets/fuzz_open.rs"
test = false
doc = false
bench = false

